# XcodeGen spec — the source of truth for Delulutopia.xcodeproj (decision D2).
# Edit this file, then run `xcodegen generate`. CI regenerates the project on every PR and commits it
# back when it drifted; on main a drift fails the build.

name: Delulutopia

options:
  bundleIdPrefix: com.delulutopia
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug-Staging: debug
  Release-Staging: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Staging: Configs/Staging.xcconfig
  Release-Staging: Configs/Staging.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  DelulutopiaKit:
    path: Packages/DelulutopiaKit

targets:
  Delulutopia:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: Delulutopia
        PRODUCT_BUNDLE_IDENTIFIER: $(DL_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DL_APP_ICON)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Push (iOS Build Q6). Xcode signs Debug with aps-environment development and an App Store
        # export with production; DLApnsEnvironment tells the server which APNs host the token is for.
        CODE_SIGN_ENTITLEMENTS: App/Delulutopia.entitlements
      configs:
        Debug-Staging:
          DL_APNS_ENVIRONMENT: sandbox
        Debug-Prod:
          DL_APNS_ENVIRONMENT: sandbox
        Release-Staging:
          DL_APNS_ENVIRONMENT: production
        Release-Prod:
          DL_APNS_ENVIRONMENT: production
    dependencies:
      - package: DelulutopiaKit
        product: AppShell
      - package: DelulutopiaKit
        product: DLDesignSystem
      - package: DelulutopiaKit
        product: DLData
      - target: DelulutopiaNotify
      - target: DelulutopiaWidgets

  # Read Ticks TK2: the Notification Service Extension. New-email pushes carry mutable-content, so
  # iOS runs it even while the app is closed; it acks the delivery with the app's session (shared
  # keychain group) and shows the notification unchanged.
  DelulutopiaNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Notify/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: DelulutopiaNotify
        PRODUCT_BUNDLE_IDENTIFIER: $(DL_BUNDLE_ID).notify
        CODE_SIGN_ENTITLEMENTS: Notify/DelulutopiaNotify.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: DelulutopiaKit
        product: DLNetwork

  # Home Screen and Lock Screen widgets (doc "Delululand — iPad Layout" WG1–WG14): board, selfies,
  # clocks and moods. They load Home with the app's session through the shared keychain group, like
  # the Notification Service Extension; faces and loader live in the package (DLWidgets).
  DelulutopiaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetsExtension
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: WidgetsExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: DelulutopiaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(DL_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: WidgetsExtension/DelulutopiaWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: DelulutopiaKit
        product: DLWidgets
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Screenshot tests hosted by the app, so screens draw through a real key window and system glass
  # renders as on a device (decision D5). Unit tests live in the package.
  DelulutopiaScreens:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/ScreenTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.delulutopia.app.screens
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Delulutopia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Delulutopia
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Delulutopia
      - package: DelulutopiaKit
        product: DLTestSupport
      - package: DelulutopiaKit
        product: DLI18n
      - package: DelulutopiaKit
        product: AppShell
      - package: DelulutopiaKit
        product: FeatureStart
      - package: DelulutopiaKit
        product: FeatureHome
      - package: DelulutopiaKit
        product: FeatureLetters
      - package: DelulutopiaKit
        product: FeatureDiscussions
      - package: DelulutopiaKit
        product: FeatureEmails
      - package: DelulutopiaKit
        product: DLUI
      - package: DelulutopiaKit
        product: DLDesignSystem
      - package: DelulutopiaKit
        product: DLData
      - package: DelulutopiaKit
        product: DLWidgets

schemes:
  Delulutopia Staging:
    build:
      targets:
        Delulutopia: all
    run:
      config: Debug-Staging
    test:
      config: Debug-Staging
      targets:
        - DelulutopiaScreens
    profile:
      config: Release-Staging
    analyze:
      config: Debug-Staging
    archive:
      config: Release-Staging
  Delulutopia:
    build:
      targets:
        Delulutopia: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
