name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SNAPSHOT_DIR: ${{ github.workspace }}/build/snapshots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project Delulutopia.xcodeproj -scheme "Delulutopia Staging"
          (cd Packages/DelulutopiaKit && swift package resolve)

      - name: Keep generated files in git
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/sync-generated.sh

      - name: Pick a simulator
        id: sim
        if: steps.sync.outputs.regenerated != 'true'
        run: echo "udid=$(tools/ci/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build Staging (Debug) and Prod (Release)
        if: steps.sync.outputs.regenerated != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project Delulutopia.xcodeproj -scheme "Delulutopia Staging" -configuration Debug-Staging \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO | xcbeautify
          xcodebuild build -project Delulutopia.xcodeproj -scheme "Delulutopia" -configuration Release-Prod \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Unit tests (package)
        if: steps.sync.outputs.regenerated != 'true'
        working-directory: Packages/DelulutopiaKit
        run: |
          set -o pipefail
          xcodebuild test -scheme DelulutopiaKit-Package -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/UnitTests.xcresult" | xcbeautify

      - name: Screenshots (app-hosted)
        if: steps.sync.outputs.regenerated != 'true'
        env:
          TEST_RUNNER_DL_SNAPSHOT_DIR: ${{ env.SNAPSHOT_DIR }}
        run: |
          set -o pipefail
          mkdir -p "$SNAPSHOT_DIR"
          xcodebuild test -project Delulutopia.xcodeproj -scheme "Delulutopia Staging" -configuration Debug-Staging \
            -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$GITHUB_WORKSPACE/build/Screenshots.xcresult" | xcbeautify

      - name: Device types (iPhone Duo check, iPad Layout IP12)
        if: steps.sync.outputs.regenerated != 'true'
        continue-on-error: true
        run: |
          xcrun simctl list devicetypes | tee "$SNAPSHOT_DIR/zz.devicetypes.txt"
          echo "::group::Foldable / Duo device types"
          grep -iE "duo|fold" "$SNAPSHOT_DIR/zz.devicetypes.txt" || echo "No iPhone Duo device type on this runner"
          echo "::endgroup::"

      - name: Pick an iPad simulator
        id: ipad
        if: steps.sync.outputs.regenerated != 'true'
        run: echo "udid=$(tools/ci/pick-simulator.sh --ipad)" >> "$GITHUB_OUTPUT"

      - name: Screenshots (iPad 13-inch, landscape + portrait)
        if: steps.sync.outputs.regenerated != 'true'
        env:
          TEST_RUNNER_DL_SNAPSHOT_DIR: ${{ env.SNAPSHOT_DIR }}
        run: |
          set -o pipefail
          xcodebuild test -project Delulutopia.xcodeproj -scheme "Delulutopia Staging" -configuration Debug-Staging \
            -destination "id=${{ steps.ipad.outputs.udid }}" CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ScreenshotsIPad.xcresult" | xcbeautify

      - name: Create an iPhone Duo simulator (iPad Layout IP12)
        id: duo
        if: steps.sync.outputs.regenerated != 'true'
        continue-on-error: true
        run: |
          profile="$(find /Library/Developer/CoreSimulator "$(xcode-select -p)/.." -path '*iPhone Duo.simdevicetype/Contents/Resources/profile.plist' 2>/dev/null | head -1)"
          if [ -n "$profile" ]; then
            echo "::group::iPhone Duo profile"
            plutil -p "$profile" | grep -iE "screen|display|fold|scale|width|height" || plutil -p "$profile"
            echo "::endgroup::"
          fi
          # Only a runtime that lists the Duo among its device types can create one.
          runtime="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and any("iPhone-Duo" in d.get("identifier","") for d in r.get("supportedDeviceTypes",[]))]
          print(sorted(rs,key=lambda r: r["version"])[-1]["identifier"] if rs else "")')"
          if [ -z "$runtime" ]; then
            echo "No installed iOS runtime supports the iPhone Duo; the Duo shots run on the iPhone at 1010 x 716 pt."
            exit 0
          fi
          udid="$(xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Screenshots (iPhone Duo)
        if: steps.sync.outputs.regenerated != 'true' && steps.duo.outputs.udid != ''
        continue-on-error: true
        env:
          TEST_RUNNER_DL_SNAPSHOT_DIR: ${{ env.SNAPSHOT_DIR }}
        run: |
          set -o pipefail
          xcodebuild test -project Delulutopia.xcodeproj -scheme "Delulutopia Staging" -configuration Debug-Staging \
            -destination "id=${{ steps.duo.outputs.udid }}" CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$GITHUB_WORKSPACE/build/ScreenshotsDuo.xcresult" | tee "$RUNNER_TEMP/duo.log" | xcbeautify
          grep -o "DUO-SCREEN.*" "$RUNNER_TEMP/duo.log" || true

      - name: Home Screen label (staging build)
        if: steps.sync.outputs.regenerated != 'true'
        continue-on-error: true
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          app="$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Debug-Staging-iphonesimulator/Delulutopia.app' | head -1)"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.delulutopia.app.test
          sleep 4
          xcrun simctl terminate "$udid" com.delulutopia.app.test
          sleep 4
          xcrun simctl io "$udid" screenshot "$SNAPSHOT_DIR/zz.home-screen.png"

      - name: Upload screenshots
        if: always() && steps.sync.outputs.regenerated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/snapshots
          if-no-files-found: warn

      - name: Upload test results
        if: failure() && steps.sync.outputs.regenerated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*.xcresult
          if-no-files-found: ignore

      - name: Publish screenshots to ci-screenshots
        if: always() && steps.sync.outputs.regenerated != 'true'
        run: tools/ci/publish-screenshots.sh "$SNAPSHOT_DIR"
